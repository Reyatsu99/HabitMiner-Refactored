name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The release APK (R8-shrunk, non-debuggable) is the one to install; the debug build
      # is kept for the unit and screenshot tests.
      - name: Build APKs and run unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease testDebugUnitTest spotlessCheck 2>&1 | tee build.log

      # Turn compiler and test failures into annotations so they show up on the
      # commit's check run without needing to open the raw logs.
      - name: Report failures
        if: failure()
        run: |
          python3 - <<'EOF'
          import re

          log = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          root = "${{ github.workspace }}/"

          def esc(s):
              return s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")

          compile_errors = []
          for line in log:
              m = re.match(r"^e: (?:file://)?(.+?\.kts?):(\d+):(\d+) (.*)$", line)
              if m:
                  path, ln, col, msg = m.groups()
                  compile_errors.append((path.replace(root, ""), ln, col, msg))
              elif line.startswith("e: "):
                  compile_errors.append((None, None, None, line[3:]))

          for path, ln, col, msg in compile_errors[:10]:
              if path:
                  print(f"::error file={path},line={ln},col={col}::{esc(msg)}")
              else:
                  print(f"::error::{esc(msg)}")

          if compile_errors:
              summary = "\n".join(
                  f"{p}:{l}:{c} {m}" if p else m for p, l, c, m in compile_errors[:80]
              )
              print(f"::error title=All compile errors ({len(compile_errors)})::{esc(summary)}")

          # Failed unit tests: the FAILED line plus the following indented lines.
          failures = []
          for i, line in enumerate(log):
              if line.rstrip().endswith(" FAILED") and ">" in line:
                  block = [line.strip()]
                  for nxt in log[i + 1 : i + 8]:
                      if nxt.startswith("    "):
                          block.append(nxt.strip())
                      else:
                          break
                  failures.append("\n".join(block))
          if failures:
              print(f"::error title=Failed tests ({len(failures)})::{esc(chr(10).join(failures[:30]))}")

          # Gradle's own "What went wrong" block (manifest, resource, KSP errors).
          for i, line in enumerate(log):
              if line.startswith("* What went wrong:"):
                  block = []
                  for nxt in log[i + 1 : i + 25]:
                      if nxt.startswith("* Try:"):
                          break
                      block.append(nxt)
                  print(f"::error title=Gradle failure::{esc(chr(10).join(block))}")
                  break
          EOF

      # Print what Room expects for each table so hand-written migrations can be compared.
      - name: Report Room schema
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, json
          for path in sorted(glob.glob("app/schemas/**/*.json", recursive=True)):
              db = json.load(open(path))["database"]
              lines = [f"version {db['version']}"]
              for e in db["entities"]:
                  lines.append(e["createSql"].replace("${TABLE_NAME}", e["tableName"]))
                  for idx in e.get("indices", []):
                      lines.append(idx["createSql"].replace("${TABLE_NAME}", e["tableName"]))
              msg = "\n".join(lines).replace("%", "%25").replace("\n", "%0A")
              print(f"::notice title=Room schema {path.split('/')[-1]}::{msg}")
          EOF

      # Stage optional screenshots and APKs as an artifact for a separate, write-enabled job.
      - name: Package CI outputs
        if: success()
        run: |
          mkdir -p ci-output
          find app/build/screenshots -type f -name '*.png' -exec cp {} ci-output/ \; 2>/dev/null || true
          if compgen -G 'app/build/outputs/apk/debug/*.apk' > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk ci-output/habitminer-debug.apk
          fi
          if compgen -G 'app/build/outputs/apk/release/*.apk' > /dev/null; then
            cp app/build/outputs/apk/release/*.apk ci-output/HabitMinerExtended.apk
          fi
          test -f ci-output/HabitMinerExtended.apk
          tar -czf ci-output.tar.gz -C ci-output .

      - name: Upload CI outputs for publisher
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output-files
          path: android/ci-output.tar.gz
          retention-days: 1

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: habitminer-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
  publish:
    name: Publish main-branch outputs
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download CI outputs
        uses: actions/download-artifact@v4
        with:
          name: ci-output-files
          path: /tmp/ci-output-artifact

      - name: Publish screenshots and APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          tar -xzf /tmp/ci-output-artifact/ci-output.tar.gz -C /tmp/out
          test -f /tmp/out/HabitMinerExtended.apk
          git config user.name "habitminer-ci"
          git config user.email "habitminer-ci@users.noreply.github.com"
          git checkout --orphan ci-outputs-tmp
          git rm -rq --cached . > /dev/null 2>&1 || true
          git clean -fdx
          cp /tmp/out/* .
          echo "Build outputs for ${GITHUB_SHA} (main)" > OUTPUTS.md
          git add -f ./*.png ./*.apk OUTPUTS.md 2>/dev/null || git add -f ./*.png OUTPUTS.md
          git commit -m "Outputs for ${GITHUB_SHA}"
          git push --force origin HEAD:refs/heads/ci-out-main
